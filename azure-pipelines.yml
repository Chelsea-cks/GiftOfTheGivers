trigger:
  - main
  - master

pool:
  name: 'Default'

variables:
  buildConfiguration: 'Release'

steps:
# 1. Install .NET SDK
- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x' # Uses .NET 10 to match your project target framework
    includePreviewVersions: true

# 2. Restore NuGet Dependencies
- task: DotNetCoreCLI@2
  displayName: 'Restore Dependencies'
  inputs:
    command: 'restore'
    projects: '**/*.slnx'

# 3. Build the Entire Solution
- task: DotNetCoreCLI@2
  displayName: 'Build Solution'
  inputs:
    command: 'build'
    projects: '**/*.slnx'
    arguments: '--configuration $(buildConfiguration)'

# 4. Run Automated Tests (Unit, Integration, Selenium)
- task: DotNetCoreCLI@2
  displayName: 'Run All Tests (Section B)'
  inputs:
    command: 'test'
    projects: 'GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj'
    arguments: '--configuration $(buildConfiguration) --logger trx'
    publishTestResults: true

# 5. Publish Test Results to Azure DevOps Pipeline Summary
- task: PublishTestResults@2
  displayName: 'Publish Test Results'
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/*.trx'
    failTaskOnFailedTests: true