trigger:
  - master

pool:
  name: 'Default'

variables:
  buildConfiguration: 'Release'

stages:
- stage: BuildAndTest
  displayName: 'Build and Test Stage'
  jobs:
  - job: BuildAndTestJob
    displayName: 'Build, Test, and Publish Artifacts'
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore Dependencies'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build Solution'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: 'Run All Tests'
      inputs:
        command: 'test'
        projects: '**/*Tests/*.csproj'
        arguments: '--configuration $(buildConfiguration) --logger trx'

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '**/*.trx'

    - task: DotNetCoreCLI@2
      displayName: 'Publish Web App Artifact'
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/Web'
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      displayName: 'Upload Artifact to Pipeline'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/Web'
        ArtifactName: 'GiftOfTheGiversRelease'
        publishLocation: 'Container'

- stage: DeployToStaging
  displayName: 'Deployment Stage (Section C)'
  dependsOn: BuildAndTest
  jobs:
  - job: DeployStagingJob
    displayName: 'Deploy to Local Staging Folder'
    steps:
    - download: current
      artifact: 'GiftOfTheGiversRelease'
    
    - task: PowerShell@2
      displayName: 'Extract and Deploy Files'
      inputs:
        targetType: 'inline'
        script: |
          $destination = "C:\Deployment\GiftOfTheGivers"
          if (!(Test-Path $destination)) {
              New-Item -ItemType Directory -Force -Path $destination
          }
          Write-Host "Deploying build artifacts to $destination..."
          Expand-Archive -Path "$(Pipeline.Workspace)\GiftOfTheGiversRelease\*.zip" -DestinationPath $destination -Force
          Write-Host "Deployment completed successfully!"