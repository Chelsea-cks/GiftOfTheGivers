
trigger:
  - master

pool:
  name: 'Chelsea-Windows-Agent'

variables:
  buildConfiguration: 'Release'

stages:
- stage: BuildAndTest
  displayName: 'Build and Test Stage'
  jobs:
  - job: BuildAndTestJob
    displayName: 'Build, Test, and Publish Artifacts'
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: 'sdk'
        version: '10.0.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore Application'
      inputs:
        command: 'restore'
        projects: 'GiftOfTheGivers/GiftOfTheGivers.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build Application'
      inputs:
        command: 'build'
        projects: 'GiftOfTheGivers/GiftOfTheGivers.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: PowerShell@2
      displayName: 'Start Web App for Selenium Tests'
      inputs:
        targetType: 'inline'
        script: |
          $project = "$(Build.SourcesDirectory)\GiftOfTheGivers\GiftOfTheGivers.csproj"
          $log = "$(Agent.TempDirectory)\webapp-test.log"
          $errorLog = "$(Agent.TempDirectory)\webapp-test-error.log"
          $dll = "$(Build.SourcesDirectory)\GiftOfTheGivers\bin\Release\net10.0\GiftOfTheGivers.dll"

          if (-not (Test-Path $dll)) {
            throw "Application DLL not found: $dll"
          }

          $env:DatabaseProvider = "Sqlite"
          $env:ConnectionStrings__DefaultConnection = "Data Source=$(Agent.TempDirectory)\GiftOfTheGivers-Selenium.db"
          $env:ASPNETCORE_ENVIRONMENT = "Development"

          $process = Start-Process dotnet `
            -ArgumentList "`"$dll`" --urls http://localhost:5110" `
            -PassThru `
            -RedirectStandardOutput $log `
            -RedirectStandardError $errorLog

          $ready = $false

          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2

            if ($process.HasExited) {
              Write-Host "Web application exited with code $($process.ExitCode)."
              break
            }

            try {
              $response = Invoke-WebRequest `
                -Uri "http://localhost:5110/" `
                -UseBasicParsing `
                -TimeoutSec 5 `
                -ErrorAction Stop

              if ($response.StatusCode -eq 200) {
                $ready = $true
                Write-Host "Web app is ready. HTTP status: 200"
                break
              }
            }
            catch {
              Write-Host "Waiting for web app..."
            }
          }

          if (-not $ready) {
            Get-Content $log -ErrorAction SilentlyContinue
            Get-Content $errorLog -ErrorAction SilentlyContinue
            throw "The web app did not become ready at http://localhost:5110/."
          }

    - task: DotNetCoreCLI@2
      displayName: 'Run All Tests'
      inputs:
        command: 'test'
        projects: 'GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj'
        arguments: '--configuration $(buildConfiguration) --logger "trx;LogFileName=GiftOfTheGivers-Tests.trx"'

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '**/GiftOfTheGivers-Tests.trx'
        failTaskOnFailedTests: false
        failTaskOnMissingResultsFile: false

    - task: PowerShell@2
      displayName: 'Stop Test Web App'
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          $processes = Get-CimInstance Win32_Process |
            Where-Object {
              $_.Name -eq 'dotnet.exe' -and
              $_.CommandLine -like '*GiftOfTheGivers.dll*'
            }

          foreach ($item in $processes) {
            Stop-Process -Id $item.ProcessId -Force -ErrorAction SilentlyContinue
          }

    - task: DotNetCoreCLI@2
      displayName: 'Publish Web App'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'GiftOfTheGivers/GiftOfTheGivers.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/Web'
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      displayName: 'Upload Artifact to Pipeline'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/Web'
        ArtifactName: 'GiftOfTheGiversRelease'
        publishLocation: 'Container'

- stage: DeployToStaging
  displayName: 'Deploy to Azure App Service'
  dependsOn: BuildAndTest
  condition: succeeded()
  jobs:
  - job: DeployWebApp
    displayName: 'Deploy Gift of the Givers Web App'
    steps:
    - download: current
      artifact: 'GiftOfTheGiversRelease'

    - task: AzureWebApp@1
      displayName: 'Deploy to Azure Web App'
      inputs:
        azureSubscription: 'GiftOfTheGivers-Azure-Connection'
        appType: 'webAppLinux'
        appName: 'giftofthegivers-disaster-relief-4827'
        package: '$(Pipeline.Workspace)/GiftOfTheGiversRelease/**/*.zip'
        deploymentMethod: 'zipDeploy'
